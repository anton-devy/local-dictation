name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run pytest tests/unit -q
      - run: uv build
